server:
  port: ${COMMERCE_SERVICE_PORT:8083}
spring:
  application:
    name: commerce-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    host: ${COMMERCE_SMTP_HOST:localhost}
    port: ${COMMERCE_SMTP_PORT:1025}
    username: ${COMMERCE_SMTP_USERNAME:}
    password: ${COMMERCE_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${COMMERCE_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${COMMERCE_SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${COMMERCE_SMTP_STARTTLS:false}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: ${COMMERCE_SMTP_CONNECTION_TIMEOUT:5000}
      mail.smtp.timeout: ${COMMERCE_SMTP_READ_TIMEOUT:10000}
      mail.smtp.writetimeout: ${COMMERCE_SMTP_WRITE_TIMEOUT:10000}
balaio:
  catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8081}
  profile-url: ${PROFILE_SERVICE_URL:http://localhost:8082}
  internal-token: ${BALAIO_INTERNAL_TOKEN:}
  jwt:
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
    issuer: ${JWT_ISSUER:}
    audience: ${JWT_AUDIENCE:}
  mail:
    from: ${COMMERCE_MAIL_FROM:nao-responda@localhost}
    frontend-url: ${COMMERCE_FRONTEND_BASE_URL:http://localhost:4321}
    paralelo: ${BALAIO_MAIL_PARALELO:false}
    concorrencia: ${BALAIO_MAIL_CONCORRENCIA:8}
    max-lotes-por-ciclo: ${BALAIO_MAIL_MAX_LOTES_POR_CICLO:20}
  painel:
    catalogo-timeout-ms: ${COMMERCE_PAINEL_CATALOGO_TIMEOUT_MS:800}
    paralelo: ${BALAIO_PAINEL_PARALELO:true}
  pagamento:
    simulador:
      # Só para desenvolvimento: provedor de pagamento simulado. Não pode coexistir com Mercado Pago.
      ativo: ${BALAIO_PAGAMENTO_SIMULADOR_ATIVO:false}
payment:
  mercadopago:
    environment: ${MERCADOPAGO_ENVIRONMENT:}
    base-url: ${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
    access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
    webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
    notification-url: ${MERCADOPAGO_NOTIFICATION_URL:}
    frontend-return-url: ${FRONTEND_RETURN_URL:}
frete:
  melhor-envio:
    base-url: ${MELHORENVIO_BASE_URL:https://sandbox.melhorenvio.com.br}
    token: ${MELHORENVIO_TOKEN:}
    cep-origem: ${MELHORENVIO_CEP_ORIGEM:50030230}
    user-agent: ${MELHORENVIO_USER_AGENT:Balaio homologacao}
    servicos: ${MELHORENVIO_SERVICOS:}
  local:
    retirada-ativa: ${FRETE_RETIRADA_ATIVA:true}
    entrega-ativa: ${FRETE_ENTREGA_LOCAL_ATIVA:true}
    prefixo-cep-digitos: ${FRETE_ENTREGA_LOCAL_PREFIXO_CEP:5}
    valor-entrega: ${FRETE_ENTREGA_LOCAL_VALOR:0.00}
  pacote:
    altura-cm: ${FRETE_PACOTE_ALTURA_CM:15}
    largura-cm: ${FRETE_PACOTE_LARGURA_CM:20}
    comprimento-cm: ${FRETE_PACOTE_COMPRIMENTO_CM:25}
    peso-kg: ${FRETE_PACOTE_PESO_KG:1.0}
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
