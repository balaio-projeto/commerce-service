name: CI

on:
  push:
  pull_request:

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMMERCE_POSTGRES_TEST: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build e testes
        run: |
          chmod +x mvnw
          ./mvnw -B verify
